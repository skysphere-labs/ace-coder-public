<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ace app icon: the Indigo Spade (approved 2026-07-02) on the graphite
       tile. Tile geometry (64px margin, rx 200) matches the macOS icon grid
       the previous icon used. Regenerate electron/assets/icon.icns +
       icon.png from this file (headless-Chrome renders + iconutil). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2026"/>
      <stop offset="0.55" stop-color="#17181C"/>
      <stop offset="1" stop-color="#111216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#6673E4" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#6673E4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#6673E4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gBladeOuter" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#C3CCF8"/><stop offset="1" stop-color="#6673E4"/>
    </linearGradient>
    <linearGradient id="gBladeMid" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8B97EE"/><stop offset="1" stop-color="#4A52C0"/>
    </linearGradient>
    <linearGradient id="gBladeIn" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4A52C0"/><stop offset="1" stop-color="#31368A"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0.2" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#9FAAF2"/><stop offset="0.55" stop-color="#5A64D6"/><stop offset="1" stop-color="#3A40A0"/>
    </linearGradient>
    <linearGradient id="gTail" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3A40A0"/><stop offset="1" stop-color="#232868"/>
    </linearGradient>
  
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <g transform="translate(121,125) scale(1.5)">

