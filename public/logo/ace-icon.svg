  <path fill="url(#gBladeMid)" d="M 244 88 C 188 134, 152 200, 152 262 C 152 308, 174 338, 210 346 C 184 332, 170 304, 172 262 C 174 208, 204 140, 244 88 Z"/>
  <path fill="url(#gBladeIn)" d="M 250 96 C 216 140, 198 200, 202 252 C 205 288, 224 310, 248 320 C 232 302, 220 282, 218 252 C 215 205, 228 148, 250 96 Z"/>
  <circle cx="342" cy="268" r="11" fill="#EEF1FC"/>

